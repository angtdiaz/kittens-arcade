<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        /* The room's own colours, the same in both Orca themes: it is always night in there. */
        --ink: #ffffff;
        --ink-soft: #c9c3e6;
        --gold: #ffd166;
        --gold-edge: #b9812f;
        --heart: #ff6b81;
        --heart-lost: #4a4268;
        --card: rgba(20, 17, 34, 0.92);
        --card-edge: #5a5185;
        --button: #3a3260;
        --button-hover: #4a4178;
        --button-primary: #ffd166;
        --button-primary-ink: #2b2118;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #221d3a;
        color: var(--ink);
        font: 12px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      [hidden] {
        display: none !important;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        outline: none;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
      }
      #room {
        display: block;
        image-rendering: pixelated;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--wall-height, 52px);
        box-sizing: border-box;
        padding: 0 10px 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
      }
      .hud-start {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hud-pause {
        pointer-events: auto;
        padding: 2px 8px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      #hud-left {
        min-width: 3ch;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #hud-center {
        color: var(--ink-soft);
      }
      #purse {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.3;
      }
      #hud-note {
        color: var(--ink-soft);
      }
      .heart {
        color: var(--heart);
        font-size: 14px;
      }
      .heart.lost {
        color: var(--heart-lost);
      }
      #hud-center.hit {
        animation: hit 0.4s;
      }
      @keyframes hit {
        25%,
        75% {
          transform: translateX(-2px);
        }
        50% {
          transform: translateX(2px);
        }
      }
      .coin {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border: 1px solid var(--gold-edge);
        border-radius: 50%;
        background: var(--gold);
        vertical-align: -1px;
      }
      .coins {
        color: var(--gold);
        font-weight: 700;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--button);
        border: 1px solid var(--card-edge);
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--button-hover);
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button.primary {
        color: var(--button-primary-ink);
        background: var(--button-primary);
        border-color: var(--gold-edge);
        font-weight: 700;
      }
      .card,
      .sheet {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid var(--card-edge);
        border-radius: 6px;
        background: var(--card);
        cursor: default;
      }
      .card {
        left: 50%;
        top: calc(50% + var(--wall-height, 52px) / 2);
        transform: translate(-50%, -50%);
        width: min(260px, calc(100% - 24px));
        max-height: calc(100% - var(--wall-height, 52px) - 16px);
        overflow-y: auto;
        padding: 16px;
        text-align: center;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 18px;
        color: var(--gold);
      }
      .card p {
        margin: 0 0 8px;
      }
      .card .soft {
        color: var(--ink-soft);
      }
      .card .gold {
        color: var(--gold);
        font-weight: 700;
      }
      .card .big {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      #lobby {
        width: min(320px, calc(100% - 24px));
      }
      #lobby-kitten {
        width: 100px;
        height: 80px;
        image-rendering: pixelated;
      }
      .games {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }
      .game {
        display: grid;
        grid-template-columns: 82px 1fr;
        grid-template-rows: auto auto auto;
        column-gap: 10px;
        align-items: center;
        padding: 8px;
        text-align: left;
      }
      .game canvas {
        grid-row: 1 / 4;
        width: 82px;
        height: 40px;
        border-radius: 3px;
        image-rendering: pixelated;
      }
      .game-name {
        font-weight: 700;
        color: var(--gold);
      }
      .game-line,
      .game-best {
        font-size: 11px;
        color: var(--ink-soft);
      }
      .levels {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        margin-top: 8px;
      }
      .levels button {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .levels small {
        font-size: 10px;
        opacity: 0.85;
      }
      #pairs-board {
        position: absolute;
        left: 8px;
        right: 8px;
        display: grid;
        justify-content: center;
        align-content: start;
        gap: 6px;
      }
      .tile {
        height: var(--tile-height, 60px);
        padding: 0;
        border: 0;
        background: none;
      }
      .tile:hover:not(:disabled) {
        background: none;
        filter: brightness(1.15);
      }
      .tile canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .tile.turn {
        animation: turn 0.18s ease-out;
      }
      .tile.matched {
        cursor: default;
      }
      @keyframes turn {
        from {
          transform: scaleX(0.1);
        }
        to {
          transform: scaleX(1);
        }
      }
      .how {
        margin: 0 0 4px;
        text-align: left;
      }
      .how dt {
        margin-top: 8px;
        font-weight: 700;
        color: var(--gold);
      }
      .how dd {
        margin: 2px 0 0;
        color: var(--ink-soft);
      }
      .how-fold {
        margin-top: 4px;
        text-align: left;
      }
      .how-fold summary {
        cursor: pointer;
        color: var(--gold);
        text-align: center;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
      }
      .actions .primary {
        flex-basis: 100%;
      }
      .sheet {
        top: calc(var(--wall-height, 52px) + 6px);
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }
      .sheet header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sheet h2 {
        margin: 0;
        font-size: 15px;
        color: var(--gold);
      }
      .tabs {
        display: flex;
        gap: 6px;
      }
      .tabs button {
        flex: 1;
      }
      .tabs button[aria-selected='true'] {
        background: var(--button-hover);
        border-color: var(--gold);
      }
      #shop-items {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 8px;
        align-content: start;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border: 1px solid var(--card-edge);
        border-radius: 4px;
      }
      .item.worn {
        border-color: var(--gold);
      }
      .item canvas {
        width: 80px;
        height: 64px;
        border-radius: 3px;
        /* The room's floor, so a dark coat shows as it will when playing. */
        background: #3a3456;
        image-rendering: pixelated;
      }
      .item button {
        width: 100%;
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--card-edge);
      }
      .sheet .done {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div id="stage" tabindex="0" aria-label="Kittens Arcade">
      <canvas id="room"></canvas>
      <div id="hud">
        <span class="hud-start">
          <button id="hud-pause" class="hud-pause" type="button" aria-label="Pause" title="Pause (P or Esc)" hidden>II</button>
          <span id="hud-left"></span>
        </span>
        <span id="hud-center"></span>
        <span id="purse">
          <span class="coins"><span class="coin"></span><span id="coins">0</span></span>
          <span id="hud-note"></span>
        </span>
      </div>
      <section id="lobby" class="card" aria-labelledby="lobby-title" hidden>
        <h1 id="lobby-title">Kittens Arcade</h1>
        <canvas id="lobby-kitten"></canvas>
        <div class="games" id="games"></div>
        <div class="actions">
          <button id="open-shop" type="button">Shop</button>
          <button id="open-settings" type="button">Settings</button>
        </div>
      </section>
      <div id="pairs-board" hidden></div>
      <div id="pairs-card" class="card" role="dialog" aria-labelledby="pairs-title" hidden>
        <h1 id="pairs-title"></h1>
        <div id="pairs-body"></div>
        <div class="levels" id="pairs-levels"></div>
        <div class="actions" id="pairs-actions"></div>
      </div>
      <div id="maze-card" class="card" role="dialog" aria-labelledby="maze-title" hidden>
        <h1 id="maze-title"></h1>
        <div id="maze-body"></div>
        <div class="levels" id="maze-levels"></div>
        <div class="actions" id="maze-actions"></div>
      </div>
      <div id="catching-card" class="card" role="dialog" aria-labelledby="catching-title" hidden>
        <h1 id="catching-title"></h1>
        <div id="catching-body"></div>
        <div class="actions" id="catching-actions"></div>
      </div>
      <div id="shop" class="sheet" role="dialog" aria-labelledby="shop-title" hidden>
        <header>
          <h2 id="shop-title">Shop</h2>
          <span class="coins"><span class="coin"></span><span id="shop-coins">0</span></span>
        </header>
        <div class="tabs" role="tablist">
          <button id="tab-coats" role="tab" type="button">Kittens</button>
          <button id="tab-accessories" role="tab" type="button">Accessories</button>
        </div>
        <div id="shop-items"></div>
        <button class="done" data-close type="button">Done</button>
      </div>
      <div id="settings" class="sheet" role="dialog" aria-labelledby="settings-title" hidden>
        <header>
          <h2 id="settings-title">Settings</h2>
        </header>
        <div class="setting">
          <span>Sound</span>
          <button id="sound-toggle" role="switch" type="button"></button>
        </div>
        <button class="done" data-close type="button">Done</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
